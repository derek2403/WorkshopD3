<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#F8FAFC"/>
  <!-- Background elements -->
  <circle cx="120" cy="200" r="80" fill="#EBF8FF" />
  <circle cx="480" cy="200" r="100" fill="#E6FFFA" />
  <circle cx="300" cy="100" r="60" fill="#F0FFF4" />
  <circle cx="300" cy="300" r="70" fill="#FFFAF0" />
  
  <!-- Charts and graphs -->
  <!-- Bar chart -->
  <rect x="100" y="250" width="30" height="80" rx="4" fill="#3182CE" />
  <rect x="140" y="200" width="30" height="130" rx="4" fill="#4299E1" />
  <rect x="180" y="230" width="30" height="100" rx="4" fill="#63B3ED" />
  <rect x="220" y="180" width="30" height="150" rx="4" fill="#3182CE" />
  
  <!-- Line chart -->
  <path d="M300 220 L330 180 L360 200 L390 150 L420 170 L450 130 L480 160" stroke="#2C5282" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="300" cy="220" r="6" fill="#2C5282" />
  <circle cx="330" cy="180" r="6" fill="#2C5282" />
  <circle cx="360" cy="200" r="6" fill="#2C5282" />
  <circle cx="390" cy="150" r="6" fill="#2C5282" />
  <circle cx="420" cy="170" r="6" fill="#2C5282" />
  <circle cx="450" cy="130" r="6" fill="#2C5282" />
  <circle cx="480" cy="160" r="6" fill="#2C5282" />
  
  <!-- Pie chart -->
  <path d="M300 100 L300 40 A60 60 0 0 1 352 130 Z" fill="#805AD5" />
  <path d="M300 100 L352 130 A60 60 0 0 1 248 130 Z" fill="#6B46C1" />
  <path d="M300 100 L248 130 A60 60 0 0 1 300 40 Z" fill="#553C9A" />
  
  <!-- Scatter plot -->
  <circle cx="380" cy="280" r="5" fill="#38A169" />
  <circle cx="400" cy="310" r="5" fill="#38A169" />
  <circle cx="420" cy="270" r="5" fill="#38A169" />
  <circle cx="440" cy="290" r="5" fill="#38A169" />
  <circle cx="460" cy="320" r="5" fill="#38A169" />
  <circle cx="480" cy="260" r="5" fill="#38A169" />
  <circle cx="500" cy="300" r="5" fill="#38A169" />
  
  <!-- Data points and connections -->
  <circle cx="150" cy="100" r="8" fill="#DD6B20" />
  <circle cx="200" cy="120" r="8" fill="#DD6B20" />
  <circle cx="250" cy="80" r="8" fill="#DD6B20" />
  <path d="M150 100 L200 120 L250 80" stroke="#DD6B20" stroke-width="2" stroke-dasharray="4 2" />
  
  <!-- Decorative elements -->
  <rect x="100" y="350" width="400" height="2" rx="1" fill="#CBD5E0" />
  <rect x="100" y="350" width="2" height="400" rx="1" transform="rotate(90 100 350)" fill="#CBD5E0" />
</svg> 